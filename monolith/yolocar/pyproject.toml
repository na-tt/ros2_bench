[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yolocar"
dynamic = ["version"]
description = "YOLO road-object detection pipeline (TensorRT), benchmarked against its ROS 2 counterpart"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.10",
]

[project.optional-dependencies]
# Only needed to (re)export the ONNX model that the .engine is built from.
export = [
    "ultralytics>=8.3",
    "onnx>=1.16",
]
dev = [
    "pytest>=8",
]

[project.scripts]
yolocar = "yolocar.main:main"

[tool.setuptools.dynamic]
version = { attr = "yolocar.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["yolocar*"]

[tool.setuptools.package-data]
yolocar = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "hardware: needs a CUDA device, tensorrt, cv2 and a built .engine; skips itself when they are missing (tests/test_yolocar_hardware.py)",
]
